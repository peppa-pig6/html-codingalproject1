<!DOCTYPE html>
<html>
    <head>
        <title>Variables</title>
    </head>
    <body>
        <h1>Variables In JavaScript</h1>
        <p>Variables are containers for storing data values.</p>

        <script>
            var num1 = 2;
            var num2 = 3;
            var sum = num1 + num2;
            document.write("The sum of " + num1 + " and " + num2 + " is " + sum);
        </script>

    </body>
</html>
