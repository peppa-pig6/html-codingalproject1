<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Study Progress Dashboard</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .jumbotron {
            background-color: #007bff;
            color: white;
            margin-bottom: 30px;
        }
        .card {
            margin-bottom: 20px;
        }
        .progress {
            height: 25px;
        }
        .subject-btn {
            margin: 6px;
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- Jumbotron Header -->
        <div class="jumbotron text-center">
            <h1 class="display-4">📊 My Study Progress</h1>
            <p class="lead">Track your learning journey • Stay consistent!</p>
        </div>

        <h3 class="text-center mb-4">My Subjects</h3>

        <!-- Subject Buttons -->
        <div class="text-center mb-4">
            <button class="btn btn-primary subject-btn">Mathematics</button>
            <button class="btn btn-success subject-btn">Science</button>
            <button class="btn btn-info subject-btn">English</button>
            <button class="btn btn-warning subject-btn">History</button>
            <button class="btn btn-danger subject-btn">Computer</button>
        </div>

        <div class="row">

            <div class="col-md-6 col-lg-4">
                <div class="card">
                    <div class="card-body">
                        <h5>Mathematics <span class="badge badge-primary float-right">42 Lessons</span></h5>
                        <div class="progress mt-3">
                            <div class="progress-bar bg-primary" style="width: 75%">75%</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-6 col-lg-4">
                <div class="card">
                    <div class="card-body">
                        <h5>Science <span class="badge badge-success float-right">28 Lessons</span></h5>
                        <div class="progress mt-3">
                            <div class="progress-bar bg-success" style="width: 60%">60%</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-6 col-lg-4">
                <div class="card">
                    <div class="card-body">
                        <h5>English <span class="badge badge-info float-right">35 Lessons</span></h5>
                        <div class="progress mt-3">
                            <div class="progress-bar bg-info" style="width: 90%">90%</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-6 col-lg-4">
                <div class="card">
                    <div class="card-body">
                        <h5>History <span class="badge badge-warning float-right">19 Lessons</span></h5>
                        <div class="progress mt-3">
                            <div class="progress-bar bg-warning" style="width: 45%">45%</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-6 col-lg-4">
                <div class="card">
                    <div class="card-body">
                        <h5>Computer <span class="badge badge-danger float-right">31 Lessons</span></h5>
                        <div class="progress mt-3">
                            <div class="progress-bar bg-danger" style="width: 82%">82%</div>
                        </div>
                    </div>
                </div>
            </div>

        </div>

    </div>

</body>
</html>
