<!DOCTYPE html>
<html>

<body>
    <h1>Functions</h1>
    <p>A function is a block of code designed to perform a particular task.</p>
    <p>JavaScript functions are defined with the <code>function</code> keyword, followed by a name, followed by
        parentheses ().</p>

    <button onclick="myFunction(5)">-Execute JS Function-</button>

    <script>
        function myFunction(x, y) {
            if (y == undefined) {
                y = 2;
            }

            document.write(x * y);

        }
    </script>

</html>
